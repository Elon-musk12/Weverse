<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weverse Comment Manager</title>
  <meta name="description" content="Private dashboard prototype for managing Weverse comment targets and reply templates.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">♥</div>
        <div><strong>Weverse</strong><span>Comment Manager</span></div>
      </div>
      <nav>
        <button class="nav-item active" data-view="dashboard">▦ <span>Dashboard</span></button>
        <button class="nav-item" data-view="comments">＋ <span>Create Comment</span></button>
        <button class="nav-item" data-view="activity">◌ <span>My Comments</span></button>
        <button class="nav-item" data-view="targets">◎ <span>Targets</span></button>
        <button class="nav-item" data-view="schedule">◷ <span>Schedule</span></button>
        <button class="nav-item" data-view="activity">▥ <span>Activity Log</span></button>
        <button class="nav-item" data-view="settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="sidebar-quote">More love.<br>More support<br>for our artists ♥</div>
      <div class="sidebar-logo">▰</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="account">
          <div class="avatar">A</div>
          <div><b>Weverse Account</b><small><i></i><span id="connectionText">Demo Connected</span></small></div>
        </div>
        <div class="profile">
          <div class="profile-pic">♡</div><b>ARMY</b><span>⌄</span>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
